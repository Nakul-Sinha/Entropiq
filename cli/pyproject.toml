[project]
name = "tdp-cli"
version = "0.1.0"
description = "Entropiq command-line interface"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich>=13.7",
    "tdp-core",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdp_cli"]

[tool.uv.sources]
tdp-core = { workspace = true }
