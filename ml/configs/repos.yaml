# Training repositories for the dataset pipeline (tdp-ml manifest reads this file).
#
# Every repository with a prefetched mirror is listed. The dataset uses every repository (or the first
# max_repos, when set) that passes all criteria below; the others are recorded with the reason they
# failed. Ids are stable and never reused, because qid = id * 100 + snapshot index.
#
# issues: false means the GitHub issues are not crawled because the repository has 5,000 or more issues.
# Its bug fixes then come from commit keywords only and the bug-issue criterion is waived.
#
# Thresholds are inclusive. min_source_files is 20 rather than 80: with 80 only 12 of the 23 mirrored
# repositories qualify, and 20 files still leave the ranking metrics room to discriminate.

max_repos: null

criteria:
  min_history_days: 1095
  min_commits: 1000
  min_source_files: 20
  min_bug_issues: 30
  max_days_since_last_commit: 365
  min_snapshots: 1

repos:
  - {id: 30, name: Delgan/loguru}                         # 1,177 issues
  - {id: 3, name: pallets/click}                          # 1,819 issues
  - {id: 25, name: python-attrs/attrs}                    # 799 issues
  - {id: 28, name: paramiko/paramiko}                     # 1,756 issues
  - {id: 19, name: marshmallow-code/marshmallow}          # 1,278 issues
  - {id: 6, name: encode/httpx}                           # 925 issues
  - {id: 7, name: Kludex/starlette}                       # 794 issues
  - {id: 11, name: psf/black}                             # 2,838 issues
  - {id: 2, name: pallets/flask}                          # 2,769 issues
