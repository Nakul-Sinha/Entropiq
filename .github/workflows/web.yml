name: web

on:
  pull_request:
    paths: ["apps/web/**", "contracts/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "contracts/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: app
        run: |
          if [ -f apps/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.app.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.app.outputs.present == 'true'
        working-directory: apps/web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - if: steps.app.outputs.present != 'true'
        run: echo "No web app yet, nothing to check."
