[project]
name = "tdp-core"
version = "0.1.0"
description = "Entropiq core: mining, parsing, features, labels, model runtime, planning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "networkx>=3.3",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "pyyaml>=6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
advisor = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdp_core"]
