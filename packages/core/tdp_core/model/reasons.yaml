  mitigation: "{adj}: code nested at most {value:.0f} level{s} deep"
  adjectives: [[95, "Very deep nesting"], [80, "Deep nesting"], [50, "Moderate nesting"], [0, "Shallow nesting"]]
  exact: [[0, "Flat code: no nested blocks"]]
