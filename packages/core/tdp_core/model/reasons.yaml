  mitigation: "{adj}: its most complex function has a cyclomatic complexity of {value:.0f}"
  adjectives: [[95, "Very complex function"], [80, "Complex function"], [50, "Moderately complex functions"], [0, "Simple functions"]]
  exact: [[0, "No functions to measure"]]
cog_max:
