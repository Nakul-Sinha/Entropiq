# Reason templates for tdp_core.model.explain: one entry per base feature in FEATURE_COLUMNS.
# Copied into every model bundle as reasons.yaml when the bundle is saved.
#
# Keys of an entry:
#   template:   sentence for a reason (the feature's family raises the file's priority)
#   mitigation: sentence for a mitigation (the family lowers it)
#   adjectives: [[threshold, text], ...], thresholds strictly decreasing from at most 100 down to 0;
#               {adj} is the text of the first pair whose threshold <= percentile
#   exact:      optional [[value, sentence], ...], used instead of template and mitigation when
#               the feature's value equals that value (for example no commits at all)
# Fields: {adj}; {value} the raw feature value; {percentile} 0 to 100 within the repository;
# {top} = max(1, 100 - percentile); {s} = "" when the value rounds to 1, else "s".
# Text rules: one line of plain English, no em or en dashes, no pipe or angle-bracket characters.
# Time windows and shares quoted here (90 days, 6 months, 5% of commits) follow the default settings.

# ---------- S: static structure ----------
sloc:
  template: "{adj}: {value:,.0f} line{s} of code (top {top:.0f}% in repo)"
  mitigation: "{adj}: {value:,.0f} line{s} of code"
  adjectives: [[95, "Very large file"], [80, "Large file"], [50, "Mid-sized file"], [20, "Small file"], [0, "Very small file"]]
cc_sum:
  template: "{adj}: total cyclomatic complexity of {value:,.0f} (top {top:.0f}% in repo)"
  mitigation: "{adj}: total cyclomatic complexity of {value:,.0f}"
  adjectives: [[95, "Very complex file"], [80, "Complex file"], [50, "Moderately complex file"], [0, "Simple file"]]
cc_mean:
