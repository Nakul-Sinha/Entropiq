  mitigation: "{adj}: its functions average a cyclomatic complexity of {value:.1f}"
  adjectives: [[95, "Very branchy functions"], [80, "Branchy functions"], [50, "Moderately branchy functions"], [0, "Straightforward functions"]]
  exact: [[0, "No functions to measure"]]
cc_max:
