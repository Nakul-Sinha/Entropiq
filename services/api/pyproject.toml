[project]
name = "tdp-api"
version = "0.1.0"
description = "Entropiq HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "prometheus-fastapi-instrumentator>=7.0",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "tdp-core",
    "tdp-platform",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdp_api"]

[tool.uv.sources]
tdp-core = { workspace = true }
tdp-platform = { workspace = true }
