[project]
name = "tdp-worker"
version = "0.1.0"
description = "Entropiq background workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tdp-core",
    "tdp-platform",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tdp_worker"]

[tool.uv.sources]
tdp-core = { workspace = true }
tdp-platform = { workspace = true }
