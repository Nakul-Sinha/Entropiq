[project]
name = "entropiq"
version = "0.1.0"
description = "Entropiq workspace: ranks technical debt by future maintenance pain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tdp-core",
    "tdp-platform",
    "tdp-api",
    "tdp-worker",
    "tdp-cli",
    "tdp-ml",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/platform", "services/api", "services/worker", "cli", "ml"]

[tool.uv.sources]
tdp-core = { workspace = true }
tdp-platform = { workspace = true }
tdp-api = { workspace = true }
tdp-worker = { workspace = true }
tdp-cli = { workspace = true }
tdp-ml = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3",
    "pandas-stubs",
    "types-PyYAML",
    "types-networkx",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "fakeredis>=2.25",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps", "data", "models", "results", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tdp_core", "tdp_platform", "tdp_api", "tdp_worker", "tdp_cli", "tdp_ml"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
# Test folders have no __init__.py; explicit bases give each test file a unique module name
# (tests.mining.test_git), so equal file names in different folders never clash.
explicit_package_bases = true
mypy_path = "packages/core"

[[tool.mypy.overrides]]
module = ["tdp_core", "tdp_core.*"]
strict = true

[[tool.mypy.overrides]]
module = [
    "pyarrow", "pyarrow.*",
    "scipy", "scipy.*",
    "sklearn", "sklearn.*",
    "shap", "shap.*",
    "xgboost", "xgboost.*",
    "tree_sitter_python", "tree_sitter_python.*",
    "optuna", "optuna.*",
    "mlflow", "mlflow.*",
    "celery", "celery.*",
    "slowapi", "slowapi.*",
    "fakeredis", "fakeredis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services", "cli", "ml"]
addopts = "-m 'not network' --import-mode=importlib"
markers = [
    "network: hits the network (skipped by default; run with -m network)",
    "leakage: leakage checks on the real dataset",
    "integration: needs Postgres or Redis (set TEST_DATABASE_URL / TEST_REDIS_URL; skipped otherwise)",
]
